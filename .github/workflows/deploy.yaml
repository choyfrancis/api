name: Basic Deploy Workflow

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1st - Checkout code
        uses: actions/checkout@v4

      - name: 2nd - Use nodejs version 24.18.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: 3rd - Check nodejs version 24.18.0
        run: |
          node -v
          npm -v

      - name: 4th - Install and build
        run: |
          npm ci
          npm run build

      - name: 5th - Package release
        run: |
          zip -r release.zip \
            appspec.yaml \
            scripts \
            package.json \
            package-lock.json \
            dist

      - name: 6th - Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2

